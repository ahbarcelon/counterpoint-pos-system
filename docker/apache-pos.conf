<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # The upload volume hides the image's .htaccess, so enforce this in Apache.
    <Directory /var/www/html/public/uploads>
        AllowOverride None
        Options -Indexes
        <FilesMatch "\.(php|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
